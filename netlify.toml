# Netlify detecta o Next.js e usa o runtime oficial automaticamente.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Valores PÚBLICOS do Supabase (podem ficar no repositório; o acesso é limitado pelas políticas RLS).
  # A chave secreta nunca vai aqui.
  NEXT_PUBLIC_SUPABASE_URL = "https://vjclcqslgojxtceityii.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1SI1c6FB6cmoP8hmw3s4Qg_C1bjAYmW"

# Cabeçalhos de segurança para todas as páginas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # só HTTPS por 2 anos (inclui subdomínios)
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    # de onde o portal pode carregar coisas: só dele mesmo e do Supabase do projeto
    # (scripts/estilos inline são exigência do Next.js; imagens podem vir de qualquer endereço HTTPS)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https://vjclcqslgojxtceityii.supabase.co; connect-src 'self' https://vjclcqslgojxtceityii.supabase.co wss://vjclcqslgojxtceityii.supabase.co; font-src 'self' data:; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
