name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # valores públicos (os mesmos do netlify.toml); a chave secreta nunca entra no CI
      NEXT_PUBLIC_SUPABASE_URL: https://vjclcqslgojxtceityii.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_1SI1c6FB6cmoP8hmw3s4Qg_C1bjAYmW
      # conta de teste opcional para os testes logados (configure em Settings > Secrets > Actions)
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Testes de unidade
        run: npm test
      - name: Build
        run: npm run build
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Testes de fluxo
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
